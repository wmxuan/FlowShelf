name: Build & Release FlowShelf

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      create-release:
        description: "是否创建 Release"
        required: false
        default: "no"
        type: choice
        options:
          - "yes"
          - "no"

jobs:
  # ── 1. 构建前端静态文件 ──────────────────────────────────
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: 📥 Install dependencies
        run: cd frontend && npm ci

      - name: 🏗️ Build static site
        run: cd frontend && npm run build

      - name: 📤 Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/out/

  # ── 2. 构建浏览器扩展 ──────────────────────────────────
  build-extension:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: flowshelf-extension/package-lock.json

      - name: 📥 Install dependencies
        run: cd flowshelf-extension && npm ci

      - name: 🏗️ Build extension
        run: cd flowshelf-extension && npm run build

      - name: 📤 Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-dist
          path: flowshelf-extension/dist/

  # ── 3. 构建后端二进制 ──────────────────────────
  build-backend:
    needs: build-frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 📥 Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: backend/frontend_dist/

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 🔍 Verify Python architecture
        run: |
          echo "Runner OS: $RUNNER_OS"
          echo "Runner Arch: $RUNNER_ARCH"
          python -c "import struct,platform; print(f'Python arch: {struct.calcsize(\"P\")*8}-bit, machine: {platform.machine()}')"
          if [ "${{ matrix.platform }}" = "macos" ]; then
            echo "Rosetta available: $(/usr/bin/pgrep oahd >/dev/null 2>&1 && echo YES || echo NO)"
          fi
        shell: bash

      - name: 🗜️ UPX Cache
        id: upx-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/upx
            ./upxbin
            ./upx-*
          key: upx-${{ matrix.platform }}-${{ env.UPX_VERSION || '5.1.0' }}

      - name: 🗜️ Install UPX
        run: |
          set -e
          if [ "${{ matrix.platform }}" = "windows" ]; then
            UPX_VERSION="${UPX_VERSION:-5.1.0}"
            mkdir -p ~/.cache/upx
            if [ ! -f ~/.cache/upx/upx-${UPX_VERSION}-win64/upx.exe ]; then
              curl -L -o upx.zip "https://github.com/upx/upx/releases/download/v${UPX_VERSION}/upx-${UPX_VERSION}-win64.zip"
              unzip -o upx.zip -d ~/.cache/upx/
            fi
            export PATH="$HOME/.cache/upx/upx-${UPX_VERSION}-win64:$PATH"
          elif [ "${{ matrix.platform }}" = "macos" ]; then
            if ! command -v upx >/dev/null 2>&1; then
              brew install upx >/dev/null 2>&1 || echo "UPX brew install skipped"
            fi
          fi
          echo "=== UPX version ==="
          command -v upx && upx --version || echo "UPX 不可用，跳过压缩"
        shell: bash

      - name: 📦 Install dependencies (requirements-base.txt，无 torch 以控体积)
        run: |
          cd backend
          # macOS: 通过 Rosetta 以 x86_64 模式创建 venv 和安装依赖
          # 这样 PyInstaller 打包的 Python 是 x86_64，产出 x86_64 二进制
          if [ "${{ matrix.platform }}" = "macos" ]; then
            arch -x86_64 python3 -m venv .venv
            source .venv/bin/activate
            arch -x86_64 python -m pip install --upgrade pip
            arch -x86_64 pip install -r requirements-base.txt
            arch -x86_64 pip install pyinstaller
          else
            python -m venv .venv
            source .venv/bin/activate 2>/dev/null || .venv\Scripts\activate.bat 2>/dev/null || true
            python -m pip install --upgrade pip
            pip install -r requirements-base.txt
            pip install pyinstaller
          fi
          echo "=== 已安装包列表 ==="
          pip list
          echo "=== Venv Python arch ==="
          python -c "import struct,platform; print(f'{struct.calcsize(\"P\")*8}-bit, machine={platform.machine()}')"
        shell: bash

      - name: 🏗️ Build binary with PyInstaller
        run: |
          cd backend
          source .venv/bin/activate 2>/dev/null || .venv\Scripts\activate.bat 2>/dev/null || true
          if [ "${{ matrix.platform }}" = "windows" ]; then
            UPX_VERSION="${UPX_VERSION:-5.1.0}"
            export PATH="$HOME/.cache/upx/upx-${UPX_VERSION}-win64:$PATH"
          fi
          echo "=== PyInstaller start ==="
          if [ "${{ matrix.platform }}" = "macos" ]; then
            # macOS: 以 x86_64 模式运行 PyInstaller，产出 x86_64 二进制
            arch -x86_64 pyinstaller --clean flowshelf.spec
          else
            pyinstaller --clean flowshelf.spec
          fi
          echo "=== Build output ==="
          ls -lah dist/ || ls -lah backend/dist/ || true
        shell: bash

      - name: 📊 Report binary size
        shell: bash
        run: |
          cd backend
          BINS=$(find dist -name "flowshelf-backend*" -type f 2>/dev/null)
          echo "=== 二进制体积报告 (${{ matrix.platform }}) ==="
          for b in $BINS; do
            size_bytes=$(stat -c%s "$b" 2>/dev/null || stat -f%z "$b" 2>/dev/null || echo 0)
            size_mb=$(awk "BEGIN{printf \"%.1f\", $size_bytes/1048576}")
            limit_mb=2000
            pct=$(awk "BEGIN{printf \"%.1f\", $size_bytes/2147483648*100}")
            echo "$b  ->  ${size_mb}MB  (GitHub 2GB 限制已用 ${pct}%)"
            if [ "$size_bytes" -gt 2147483648 ]; then
              echo "❌ 超过 GitHub 2GB 单个 Release Asset 限制！"
              exit 1
            elif [ "$size_bytes" -gt 1073741824 ]; then
              echo "⚠️ 已超 1GB，建议进一步优化"
            else
              echo "✅ 体积合规"
            fi
          done

      - name: 🔍 Verify binary architecture
        if: matrix.platform == 'macos'
        run: |
          cd backend
          BIN=$(find dist -name "flowshelf-backend" -type f 2>/dev/null | head -1)
          if [ -n "$BIN" ]; then
            echo "=== Binary architecture ==="
            file "$BIN"
            # 确认包含 x86_64，不含纯 arm64
            if file "$BIN" | grep -q "x86_64"; then
              echo "✅ Binary contains x86_64 code"
            else
              echo "❌ Binary does NOT contain x86_64 code!"
              exit 1
            fi
          fi
        shell: bash

      - name: 📤 Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-${{ matrix.platform }}
          path: backend/dist/flowshelf-backend*

  # ── 4. 打包发布物 ──────────────────────────────────────
  package:
    needs: [build-backend, build-extension]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - platform: macos
            ext: ""
            script: "install-macos.sh"
          - platform: windows
            ext: ".exe"
            script: "install-windows.bat"
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 📥 Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-${{ matrix.platform }}
          path: package/

      - name: 📥 Download extension artifact
        uses: actions/download-artifact@v4
        with:
          name: extension-dist
          path: package/flowshelf-extension/

      - name: 📥 Copy install scripts
        run: |
          cp scripts/${{ matrix.script }} package/
          cp -r scripts/native-host package/native-host
        shell: bash

      - name: 📝 Create install README
        run: |
          cat > package/INSTALL.txt << 'EOF'
          FlowShelf 安装说明
          ===================

          1. 运行安装脚本：
             - macOS: ./install-macos.sh
             - Windows: 双击 install-windows.bat

          2. 打开 Chrome 浏览器 → chrome://extensions
          3. 开启「开发者模式」
          4. 点击「加载已解压的扩展程序」→ 选择 flowshelf-extension 目录
          5. 扩展加载后，后端会自动启动！

          如需手动启动后端：
             ./flowshelf-backend

          访问 Web 应用：
             http://localhost:8972
          EOF
        shell: bash

      - name: 📦 Set binary permissions
        if: matrix.platform != 'windows'
        run: chmod +x package/flowshelf-backend
        shell: bash

      - name: 📦 Create zip package
        run: |
          cd package
          echo "=== zip 前 package 体积分布 ==="
          du -sh * | sort -rh | head -20
          echo ""
          zip -r ../flowshelf-${{ matrix.platform }}.zip .
        shell: bash

      - name: 📊 Report zip size & enforce GitHub 2GB limit
        run: |
          ZIP_FILE="flowshelf-${{ matrix.platform }}.zip"
          size_bytes=$(stat -c%s "$ZIP_FILE" 2>/dev/null || stat -f%z "$ZIP_FILE" 2>/dev/null || echo 0)
          size_mb=$(awk "BEGIN{printf \"%.1f\", $size_bytes/1048576}")
          pct=$(awk "BEGIN{printf \"%.1f\", $size_bytes/2147483648*100}")
          echo "=== Release 包体积报告 (${{ matrix.platform }}) ==="
          echo "  文件: $ZIP_FILE"
          echo "  大小: ${size_mb}MB  (GitHub 2GB 限制已用 ${pct}%)"
          if [ "$size_bytes" -gt 2147483648 ]; then
            echo "❌ 错误：超过 GitHub 单个 Release Asset 2GB 上限！"
            echo "   请进一步优化依赖或拆分发布。"
            exit 1
          elif [ "$size_bytes" -gt 1073741824 ]; then
            echo "⚠️ 警告：已超 1GB，建议继续优化体积。"
          else
            echo "✅ 体积合规。"
          fi
        shell: bash

      - name: 📤 Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: flowshelf-${{ matrix.platform }}
          path: flowshelf-${{ matrix.platform }}.zip

  # ── 5. 创建 GitHub Release ─────────────────────────────
  release:
    needs: package
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.create-release == 'yes')
    permissions:
      contents: write
    steps:
      - name: 📥 Download all packages
        uses: actions/download-artifact@v4
        with:
          pattern: flowshelf-*
          path: release/

      - name: 📋 List release files
        run: find release/ -type f -name "*.zip" | sort
        shell: bash

      - name: 🚀 Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: FlowShelf ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
          files: release/**/*.zip
          body: |
            ## FlowShelf ${{ github.ref_name }}

            ### 下载
            | 平台 | 文件 |
            |------|------|
            | macOS (Intel) | `flowshelf-macos.zip` |
            | Windows | `flowshelf-windows.zip` |

            ### 安装步骤
            1. 解压对应平台的 zip 文件
            2. 运行安装脚本（macOS: `./install-macos.sh`，Windows: `install-windows.bat`）
            3. 在 Chrome 中加载 `flowshelf-extension` 目录（开发者模式）
            4. 扩展加载后，后端自动启动 🎉
